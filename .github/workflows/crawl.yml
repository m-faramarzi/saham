name: Saham

on:
  schedule:
    
    - cron: '0 */4 * * *'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: mkdir -p snapshots
      - name: Debug
        run: |
          pwd
          ls -la
          python --version

      - name: Run scraper
        run: |
          python -u scrape_symbol.py
          continue-on-error: true

      - name: Show exit code
        run: echo "Python finished"      
      ##- run: python extract_symbols.py
      ##- run: python scrape_symbol.py
      ##- name: Run scraper
      ##  run:  python -u scrape_symbol.py
      
      - name: Commit files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          
          git add snapshots news symbols.json

          git diff --cached --quiet || (
            git commit -m "Snapshot $(date -u '+%Y-%m-%d %H:%M')"
            git push
          )
